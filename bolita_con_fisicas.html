<style>
  :root {
    --color-background-secondary: #f9f9f9;
    --color-text-secondary: #666;
  }

  /* Reseteamos el body para que no haya márgenes blancos */
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: var(--color-background-secondary);
    /* Evita que el celular haga scroll o pull-to-refresh al tocar la pantalla */
    touch-action: none;
  }

  #canvas-wrap {
    position: relative;
    width: 100vw;
    height: 100dvh; /* Se adapta dinámicamente al alto de cualquier pantalla */
    overflow: hidden;
    cursor: default;
  }

  #c {
    display: block;
    width: 100%;
    height: 100%;
  }

  #hint {
    position: absolute;
    bottom: 24px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 14px;
    font-family: sans-serif;
    color: var(--color-text-secondary);
    pointer-events: none;
    transition: opacity 0.8s;
  }
</style>

<div id="canvas-wrap">
  <canvas id="c"></canvas>
  <div id="hint">Haz clic en la bola para lanzarla, o arrástrala 🎱</div>
</div>

<script>
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("canvas-wrap");
  const hint = document.getElementById("hint");

  let W, H;
  function resize() {
    W = canvas.width = wrap.clientWidth;
    H = canvas.height = wrap.clientHeight;
  }
  resize();
  window.addEventListener("resize", resize);

  const R = 28;
  const GRAVITY = 0.52;
  const FRICTION = 0.996;
  const BOUNCE = 0.55;
  const THREAD_LEN = 160;

  let ball = { x: 0, y: 0, vx: 1.2, vy: 0 };
  let dragging = false;
  let mouse = { x: 0, y: 0 };
  let prevMouse = { x: 0, y: 0 };
  let dragOffset = { x: 0, y: 0 };
  let trail = [];
  let hintGone = false;
  let time = 0;

  let clickStartX = 0;
  let clickStartY = 0;

  function init() {
    ball.x = W / 2;
    ball.y = H / 3;
  }

  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    const s = e.touches ? e.touches[0] : e;
    return {
      x: (s.clientX - r.left) * (W / r.width),
      y: (s.clientY - r.top) * (H / r.height),
    };
  }

  function hitBall(p) {
    const dx = p.x - ball.x,
      dy = p.y - ball.y;
    return Math.sqrt(dx * dx + dy * dy) < R + 10;
  }

  function randomLaunch() {
    const angle = Math.random() * Math.PI * 2;
    const speed = 10 + Math.random() * 12;
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed - 5;
  }

  canvas.addEventListener("mousedown", (e) => {
    const p = getPos(e);
    if (hitBall(p)) {
      dragging = true;
      dragOffset = { x: p.x - ball.x, y: p.y - ball.y };
      prevMouse = { x: p.x, y: p.y };
      mouse = { x: p.x, y: p.y };
      clickStartX = p.x;
      clickStartY = p.y;
      if (!hintGone) {
        hint.style.opacity = "0";
        hintGone = true;
      }
    }
  });

  canvas.addEventListener("mousemove", (e) => {
    prevMouse = { x: mouse.x, y: mouse.y };
    const p = getPos(e);
    mouse = { x: p.x, y: p.y };
    if (dragging) {
      ball.x = mouse.x - dragOffset.x;
      ball.y = mouse.y - dragOffset.y;
      ball.vx = (mouse.x - prevMouse.x) * 0.9;
      ball.vy = (mouse.y - prevMouse.y) * 0.9;
    }
  });

  canvas.addEventListener("mouseup", (e) => {
    if (dragging) {
      const p = getPos(e);
      const dx = p.x - clickStartX;
      const dy = p.y - clickStartY;
      if (Math.sqrt(dx * dx + dy * dy) < 5) {
        randomLaunch();
      }
    }
    dragging = false;
  });

  canvas.addEventListener(
    "touchstart",
    (e) => {
      const p = getPos(e);
      if (hitBall(p)) {
        dragging = true;
        dragOffset = { x: p.x - ball.x, y: p.y - ball.y };
        prevMouse = { x: p.x, y: p.y };
        mouse = { x: p.x, y: p.y };
        clickStartX = p.x;
        clickStartY = p.y;
        if (!hintGone) {
          hint.style.opacity = "0";
          hintGone = true;
        }
      }
      e.preventDefault();
    },
    { passive: false },
  );

  canvas.addEventListener(
    "touchmove",
    (e) => {
      prevMouse = { x: mouse.x, y: mouse.y };
      const p = getPos(e);
      mouse = { x: p.x, y: p.y };
      if (dragging) {
        ball.x = mouse.x - dragOffset.x;
        ball.y = mouse.y - dragOffset.y;
        ball.vx = (mouse.x - prevMouse.x) * 0.9;
        ball.vy = (mouse.y - prevMouse.y) * 0.9;
      }
      e.preventDefault();
    },
    { passive: false },
  );

  canvas.addEventListener("touchend", (e) => {
    if (dragging) {
      const dx = mouse.x - clickStartX;
      const dy = mouse.y - clickStartY;
      if (Math.sqrt(dx * dx + dy * dy) < 5) {
        randomLaunch();
      }
    }
    dragging = false;
  });

  function loop() {
    requestAnimationFrame(loop);
    ctx.clearRect(0, 0, W, H);
    time++;

    if (!dragging) {
      ball.vy += GRAVITY;
      ball.vx *= FRICTION;
      ball.vy *= FRICTION;
      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.y + R >= H) {
        ball.y = H - R;
        ball.vy *= -BOUNCE;
        ball.vx *= 0.92;
      }
      if (ball.y - R <= 0) {
        ball.y = R;
        ball.vy *= -BOUNCE;
      }
      if (ball.x + R >= W) {
        ball.x = W - R;
        ball.vx *= -BOUNCE;
      }
      if (ball.x - R <= 0) {
        ball.x = R;
        ball.vx *= -BOUNCE;
      }
    }

    const distToGround = H - (ball.y + R);
    const maxShadowDist = 200;

    if (distToGround < maxShadowDist) {
      const shadowAlpha = 0.25 * (1 - distToGround / maxShadowDist);
      const shadowScale = 1 + distToGround / 100;

      ctx.save();
      ctx.globalAlpha = Math.max(0, shadowAlpha);
      ctx.beginPath();
      ctx.ellipse(
        ball.x,
        H,
        R * 1.05 * shadowScale,
        R * 0.25 * shadowScale,
        0,
        0,
        Math.PI * 2,
      );
      ctx.fillStyle = "#000";
      ctx.fill();
      ctx.restore();
    }

    trail.push({ x: ball.x, y: ball.y });
    if (trail.length > THREAD_LEN) trail.shift();

    for (let i = 1; i < trail.length; i++) {
      const a = (i / trail.length) * 0.55;
      ctx.beginPath();
      ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
      ctx.lineTo(trail[i].x, trail[i].y);
      ctx.strokeStyle = `rgba(30,30,30,${a * 0.25})`;
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(ball.x, ball.y, R, 0, Math.PI * 2);
    ctx.fillStyle = "#111";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(ball.x, ball.y, R, 0, Math.PI * 2);
    ctx.strokeStyle = "#333";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.save();
    const grad = ctx.createRadialGradient(
      ball.x - R * 0.35,
      ball.y - R * 0.35,
      R * 0.05,
      ball.x - R * 0.15,
      ball.y - R * 0.15,
      R * 0.8,
    );
    grad.addColorStop(0, "rgba(255, 255, 255, 0.45)");
    grad.addColorStop(1, "rgba(255, 255, 255, 0)");

    ctx.beginPath();
    ctx.arc(ball.x, ball.y, R, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();

    const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
    if (speed > 2 && !dragging) {
      ctx.save();
      ctx.globalAlpha = Math.min(speed * 0.035, 0.15);
      ctx.beginPath();
      ctx.arc(
        ball.x - ball.vx * 1.8,
        ball.y - ball.vy * 1.8,
        R * 0.88,
        0,
        Math.PI * 2,
      );
      ctx.fillStyle = "#111";
      ctx.fill();
      ctx.restore();
    }
  }

  init();
  loop();
</script>
