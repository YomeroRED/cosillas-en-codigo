<style>
  :root {
    --border-radius-lg: 12px;
    --color-border-tertiary: #ccc;
    --color-background-secondary: #f9f9f9;
    --color-text-secondary: #666;
  }
  #canvas-wrap {
    position: relative;
    width: 100%;
    height: 420px;
    overflow: hidden;
    border-radius: var(--border-radius-lg);
    border: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-secondary);
    cursor: default;
  }
  #c {
    display: block;
    width: 100%;
    height: 100%;
  }
  #hint {
    position: absolute;
    bottom: 12px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 13px;
    color: var(--color-text-secondary);
    pointer-events: none;
    transition: opacity 0.8s;
  }
</style>
<h2 class="sr-only">
  Bola de estambre negra — haz clic para lanzarla o arrástrala
</h2>
<div id="canvas-wrap">
  <canvas id="c"></canvas>
  <div id="hint">Haz clic en la bola para lanzarla, o arrástrala 🧶</div>
</div>
<script>
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("canvas-wrap");
  const hint = document.getElementById("hint");

  let W, H;
  function resize() {
    W = canvas.width = wrap.clientWidth;
    H = canvas.height = wrap.clientHeight;
  }
  resize();
  window.addEventListener("resize", resize);

  const R = 28;
  const GRAVITY = 0.52;
  const FRICTION = 0.988;
  const BOUNCE = 0.55;
  const THREAD_LEN = 160;

  let ball = { x: 0, y: 0, vx: 1.2, vy: 0 };
  let dragging = false;
  let mouse = { x: 0, y: 0 };
  let prevMouse = { x: 0, y: 0 };
  let dragOffset = { x: 0, y: 0 };
  let trail = [];
  let hintGone = false;
  let time = 0;
  let rotation = 0; // ¡Nueva variable para la rotación!

  function init() {
    ball.x = W / 2;
    ball.y = H / 3;
  }

  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    const s = e.touches ? e.touches[0] : e;
    return {
      x: (s.clientX - r.left) * (W / r.width),
      y: (s.clientY - r.top) * (H / r.height),
    };
  }

  function hitBall(p) {
    const dx = p.x - ball.x,
      dy = p.y - ball.y;
    return Math.sqrt(dx * dx + dy * dy) < R + 10;
  }

  function randomLaunch() {
    const angle = Math.random() * Math.PI * 2;
    const speed = 8 + Math.random() * 10;
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed - 4;
  }

  canvas.addEventListener("mousedown", (e) => {
    const p = getPos(e);
    if (hitBall(p)) {
      dragging = true;
      dragOffset = { x: p.x - ball.x, y: p.y - ball.y };
      prevMouse = { x: p.x, y: p.y };
      mouse = { x: p.x, y: p.y };
      if (!hintGone) {
        hint.style.opacity = "0";
        hintGone = true;
      }
    }
  });

  canvas.addEventListener("mousemove", (e) => {
    prevMouse = { x: mouse.x, y: mouse.y };
    const p = getPos(e);
    mouse = { x: p.x, y: p.y };
    if (dragging) {
      ball.x = mouse.x - dragOffset.x;
      ball.y = mouse.y - dragOffset.y;
      ball.vx = (mouse.x - prevMouse.x) * 0.9;
      ball.vy = (mouse.y - prevMouse.y) * 0.9;
    }
  });

  let wasDragging = false;
  canvas.addEventListener("mouseup", (e) => {
    wasDragging = dragging;
    dragging = false;
  });

  canvas.addEventListener("click", (e) => {
    if (!wasDragging) {
      const p = getPos(e);
      if (hitBall(p)) randomLaunch();
    }
    wasDragging = false;
  });

  canvas.addEventListener(
    "touchstart",
    (e) => {
      const p = getPos(e);
      if (hitBall(p)) {
        dragging = true;
        dragOffset = { x: p.x - ball.x, y: p.y - ball.y };
        prevMouse = { x: p.x, y: p.y };
        mouse = { x: p.x, y: p.y };
        if (!hintGone) {
          hint.style.opacity = "0";
          hintGone = true;
        }
      }
      e.preventDefault();
    },
    { passive: false },
  );

  canvas.addEventListener(
    "touchmove",
    (e) => {
      prevMouse = { x: mouse.x, y: mouse.y };
      const p = getPos(e);
      mouse = { x: p.x, y: p.y };
      if (dragging) {
        ball.x = mouse.x - dragOffset.x;
        ball.y = mouse.y - dragOffset.y;
        ball.vx = (mouse.x - prevMouse.x) * 0.9;
        ball.vy = (mouse.y - prevMouse.y) * 0.9;
      }
      e.preventDefault();
    },
    { passive: false },
  );

  canvas.addEventListener("touchend", () => {
    dragging = false;
  });

  // Modificado para dibujar desde el origen (0,0) en lugar de un (cx, cy)
  function drawYarnLines(r) {
    const lines = [
      [0.3, 0.9],
      [0.8, 0.5],
      [1.4, 0.85],
      [2.0, 0.6],
      [2.5, 0.95],
      [3.1, 0.7],
      [3.7, 0.88],
      [4.3, 0.55],
      [4.9, 0.8],
      [5.5, 0.65],
    ];
    for (const [angle, len] of lines) {
      const ex = Math.cos(angle) * r * len;
      const ey = Math.sin(angle) * r * len;
      const cpx = Math.cos(angle + 0.4) * r * len * 0.6;
      const cpy = Math.sin(angle + 0.4) * r * len * 0.6;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(cpx, cpy, ex, ey);
      ctx.strokeStyle = "rgba(255,255,255,0.09)";
      ctx.lineWidth = 1.1;
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.55, 0.5, 3.8);
    ctx.strokeStyle = "rgba(255,255,255,0.07)";
    ctx.lineWidth = 1.3;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.3, 2.0, 5.5);
    ctx.strokeStyle = "rgba(255,255,255,0.06)";
    ctx.lineWidth = 1.0;
    ctx.stroke();
  }

  function loop() {
    requestAnimationFrame(loop);
    ctx.clearRect(0, 0, W, H);
    time++;

    if (!dragging) {
      ball.vy += GRAVITY;
      ball.vx *= FRICTION;
      ball.vy *= FRICTION;
      ball.x += ball.vx;
      ball.y += ball.vy;
      if (ball.y + R >= H) {
        ball.y = H - R;
        ball.vy *= -BOUNCE;
        ball.vx *= 0.86;
      }
      if (ball.y - R <= 0) {
        ball.y = R;
        ball.vy *= -BOUNCE;
      }
      if (ball.x + R >= W) {
        ball.x = W - R;
        ball.vx *= -BOUNCE;
      }
      if (ball.x - R <= 0) {
        ball.x = R;
        ball.vx *= -BOUNCE;
      }
    }

    // Actualizar rotación basada en la velocidad X
    rotation += ball.vx / R;

    trail.push({ x: ball.x, y: ball.y });
    if (trail.length > THREAD_LEN) trail.shift();

    // Dibujar el hilo (rastro)
    for (let i = 1; i < trail.length; i++) {
      const a = (i / trail.length) * 0.55;
      ctx.beginPath();
      ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
      ctx.lineTo(trail[i].x, trail[i].y);
      ctx.strokeStyle = `rgba(30,30,30,${a * 0.5})`;
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }

    // Dibujar la sombra (sin rotar)
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.beginPath();
    ctx.ellipse(
      ball.x + 5,
      ball.y + R * 0.85,
      R * 1.05,
      R * 0.42,
      0,
      0,
      Math.PI * 2,
    );
    ctx.fillStyle = "#000";
    ctx.fill();
    ctx.restore();

    // --- DIBUJO DE LA BOLA CON ROTACIÓN ---
    ctx.save(); // Guardar el estado actual del canvas
    ctx.translate(ball.x, ball.y); // Mover el origen de coordenadas al centro de la bola
    ctx.rotate(rotation); // Rotar el canvas entero

    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2); // Ahora dibujamos en (0,0)
    ctx.fillStyle = "#111";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.strokeStyle = "#333";
    ctx.lineWidth = 1;
    ctx.stroke();

    drawYarnLines(R); // Dibujar las hebras rotadas

    ctx.restore(); // Restaurar el canvas a su estado normal (sin rotación/translación)
    // --------------------------------------

    // Desenfoque de movimiento (Motion blur)
    const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
    if (speed > 2 && !dragging) {
      ctx.save();
      ctx.globalAlpha = Math.min(speed * 0.035, 0.15);
      ctx.beginPath();
      ctx.arc(
        ball.x - ball.vx * 1.8,
        ball.y - ball.vy * 1.8,
        R * 0.88,
        0,
        Math.PI * 2,
      );
      ctx.fillStyle = "#111";
      ctx.fill();
      ctx.restore();
    }
  }

  init();
  loop();
</script>
